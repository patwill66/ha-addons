name: "eero Collector"
description: "Read-only history of an eero mesh network (clients, Wi-Fi quality, usage, mesh health) in SQLite, published to Home Assistant over MQTT."
version: "0.5.1"
slug: "eero_collector"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# MQTT discovery: the Supervisor hands over the Mosquitto credentials (publish.py).
services:
  - mqtt:need
hassio_api: true
# Long-term statistics import and Ping history for mesh tests over HA Core's WebSocket API (hastats.py, haping.py).
homeassistant_api: true
# Status, eero login, device inventory and snapshots (web.py).
ingress: true
ingress_port: 8099
panel_icon: mdi:router-wireless
panel_title: eero Network
# The database and lock live in /share/eero_collector; the eero session in /data.
map:
  - share:rw
options:
  poll_seconds: 300
  publish_seconds: 60
  tracked_devices: []
  backfill: true
  backfill_device_hourly: true
  sample_retention_days: 35
  timezone: "America/Chicago"
  publish_mqtt: true
  import_statistics: true
  import_ping: true
  mesh_test_node: "Living Room"
  mesh_test_scenarios:
    - "A: Original placement, cabinet closed"
    - "B: Same placement, cabinet door open"
    - "C: eero outside the cabinet"
    - "D: Back to the original placement"
    - "E: Basement eero isolated (optional, disrupts its clients)"
  baseline_start: ""
  baseline_end: ""
  verbose: false
schema:
  poll_seconds: int(120,900)
  publish_seconds: int(30,600)
  tracked_devices:
    - str
  backfill: bool
  backfill_device_hourly: bool
  sample_retention_days: int(7,365)
  timezone: str
  publish_mqtt: bool
  import_statistics: bool
  import_ping: bool
  mesh_test_node: str
  mesh_test_scenarios:
    - str
  baseline_start: str
  baseline_end: str
  verbose: bool
