name: "Mammotion Collector"
description: "Polls the official Mammotion API for the LUBA mower and keeps its history in SQLite (/share/mammotion_collector)."
version: "0.4.0"
slug: "mammotion_collector"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# Publishes sensor.luba_* states through the Supervisor's Home Assistant API.
homeassistant_api: true
# GET /snapshot downloads a consistent copy of the database (snapshot_server.py).
ingress: true
ingress_port: 8099
panel_icon: mdi:database-export
# The database and lock live in /share/mammotion_collector (see run.py).
map:
  - share:rw
options:
  client_id: ""
  client_secret: ""
  poll_seconds: 30
  verbose: false
  publish_sensors: true
schema:
  client_id: str
  client_secret: password
  poll_seconds: int(10,600)
  verbose: bool
  publish_sensors: bool
